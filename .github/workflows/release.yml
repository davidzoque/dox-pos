name: Build release ZIP

# Al pushear una etiqueta v* se arman dos zips: el de GitHub (con el actualizador y el español en
# languages/, el que sirve Plugin Update Checker a los sitios) y el de WordPress.org (sin vendor, sin
# Update URI, sin languages/ ni load_plugin_textdomain, y sin dox-core, que trae su propio dominio de
# traducción y sus .mo: el directorio exige que las traducciones vayan por translate.wordpress.org y
# que todo el texto use el slug del plugin).
#
# A la release solo se adjunta el de GitHub. El de WordPress.org se guarda como artefacto de la
# ejecución (pestaña Actions), y no en la release, a propósito: los sitios con una copia anterior a
# la 0.41.0 piden "el primer adjunto de la release", sin mirar el nombre, y GitHub ponía delante el
# de WordPress.org. Una tienda que actualizara así se quedaba sin el español y sin el actualizador.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar que la versión del plugin coincide con la etiqueta
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLUGIN_VERSION=$(grep -oP '^ \* Version:\s+\K[0-9.]+' dox-pos.php)
          echo "Etiqueta: $TAG_VERSION / Plugin: $PLUGIN_VERSION"
          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::La versión de la cabecera ($PLUGIN_VERSION) no coincide con la etiqueta ($TAG_VERSION)."
            exit 1
          fi

      - name: Construir los zips
        run: |
          mkdir -p build/dox-pos
          rsync -a --exclude='.git*' --exclude='.wordpress-org' --exclude='.github' --exclude='build' --exclude='*.zip' --exclude='subir.sh' --exclude='CLAUDE.md' --exclude='README.md' --exclude='phpcs.xml.dist' --exclude='tools' ./ build/dox-pos/
          cd build
          zip -rq dox-pos.zip dox-pos
          rm -rf dox-pos/vendor dox-pos/includes/updater.php dox-pos/languages dox-pos/dox-core
          sed -i '/^ \* Update URI:/d; /^ \* Domain Path:/d' dox-pos/dox-pos.php
          sed -i '/dox-pos-repo-only:inicio/,/dox-pos-repo-only:fin/d' dox-pos/dox-pos.php dox-pos/includes/install.php
          zip -rq dox-pos-wordpress-org.zip dox-pos

      - name: Crear la release y adjuntar el zip de GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: build/dox-pos.zip
          generate_release_notes: true

      - name: Guardar el zip de WordPress.org como artefacto de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: dox-pos-wordpress-org
          path: build/dox-pos-wordpress-org.zip
