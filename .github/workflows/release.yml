name: Build WordPress.org ZIP

# El plugin se reparte solo por WordPress.org. Al pushear una etiqueta v* se arma el zip del directorio
# (sin languages/, que se queda en el repo como fuente del español para translate.wordpress.org y para
# Loco Translate) y se guarda como artefacto de la ejecución (pestaña Actions).
#
# No se crea ninguna release en GitHub, a propósito: las copias antiguas instaladas desde GitHub
# (hasta la 0.41.0) se actualizan con el primer adjunto de la última release, y no deben recibir nada
# más por ahí. Se pasan a la copia del directorio con `wp plugin install dox-pos --force`.

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar que la versión del plugin coincide con la etiqueta
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLUGIN_VERSION=$(grep -oP '^ \* Version:\s+\K[0-9.]+' dox-pos.php)
          echo "Etiqueta: $TAG_VERSION / Plugin: $PLUGIN_VERSION"
          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::La versión de la cabecera ($PLUGIN_VERSION) no coincide con la etiqueta ($TAG_VERSION)."
            exit 1
          fi

      - name: Construir el zip
        run: |
          mkdir -p build/dox-pos
          rsync -a --exclude='.git*' --exclude='.wordpress-org' --exclude='.github' --exclude='build' --exclude='*.zip' --exclude='subir.sh' --exclude='CLAUDE.md' --exclude='README.md' --exclude='phpcs.xml.dist' --exclude='tools' --exclude='languages' ./ build/dox-pos/
          cd build
          zip -rq dox-pos.zip dox-pos

      - name: Guardar el zip como artefacto de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: dox-pos
          path: build/dox-pos.zip
